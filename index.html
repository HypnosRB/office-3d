<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypnos Command Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background: #050811;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 480px;
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e293b;
            margin-bottom: 12px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .title { 
            font-size: 11px; 
            font-weight: bold; 
            color: #00f0ff; 
            letter-spacing: 1px; 
        }
        .audio-btn {
            background: #f43f5e; 
            border: none; 
            color: white; 
            padding: 5px 10px;
            font-size: 9px; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
        }
        /* Kartu Status 3 Ruangan */
        .rooms-container {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .room-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            box-sizing: border-box;
        }
        .room-title { 
            font-size: 8px; 
            color: #fbbf24; 
            font-weight: bold; 
            margin-bottom: 4px; 
        }
        .room-desc {
            font-size: 7px;
            color: #94a3b8;
            margin-bottom: 6px;
            line-height: 1.2;
        }
        .status-badge {
            font-size: 7px;
            background: #1e293b;
            color: #00f0ff;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            font-weight: bold;
        }
        /* Panel Kontrol Utama */
        .control-panel {
            width: 100%;
            max-width: 480px;
            background: #0b132b;
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 14px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .panel-title { 
            font-size: 10px; 
            color: #00f0ff; 
            font-weight: bold; 
            margin-bottom: 8px; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #050811;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        button.action-btn {
            width: 100%;
            padding: 11px;
            background: #00f0ff;
            border: none;
            font-weight: bold;
            color: #050811;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        button.action-btn:active { 
            background: #0284c7; 
        }
        #processLog {
            margin-top: 10px;
            font-size: 9px;
            color: #10b981;
            line-height: 1.4;
            background: #050811;
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #334155;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">⚡ HYPNOS // COMMAND CENTER</div>
        <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🎵 Musik Chill</button>
    </div>

    <!-- 3 Ruangan Kerja Tim AI -->
    <div class="rooms-container">
        <div class="room-card">
            <div class="room-title">1. RISET</div>
            <div class="room-desc">Analisis Transkrip</div>
            <div class="status-badge" id="badgeRes">READY</div>
        </div>
        <div class="room-card">
            <div class="room-title">2. EDITOR</div>
            <div class="room-desc">Cutting Presisi</div>
            <div class="status-badge" id="badgeEdt">READY</div>
        </div>
        <div class="room-card">
            <div class="room-title">3. UPLOADER</div>
            <div class="room-desc">Kirim Telegram</div>
            <div class="status-badge" id="badgeUpl">READY</div>
        </div>
    </div>

    <!-- Panel Input & Eksekusi Tugas -->
    <div class="control-panel">
        <div class="panel-title">⚡ MASUKKAN LINK YOUTUBE TARGET</div>
        <input type="text" id="ytLink" placeholder="Tempel link YouTube di sini...">
        <button class="action-btn" onclick="submitVideoLink()">Mulai Produksi 5 Klip</button>
        <div id="processLog">Status: Karyawan AI standby di ruangan masing-masing...</div>
    </div>

    <script>
        try { window.Telegram.WebApp.ready(); } catch(e) {}

        function submitVideoLink() {
            const url = document.getElementById('ytLink').value;
            const log = document.getElementById('processLog');
            
            if(!url) {
                log.style.color = "#f43f5e";
                log.innerText = "❌ Masukkan link YouTube terlebih dahulu!";
                return;
            }

            log.style.color = "#00f0ff";
            log.innerText = "⏳ Perintah terkirim! Silakan pantau progres persentase real-time di chat Telegram.";

            // Ubah indikator ruangan di web
            document.getElementById('badgeRes').innerText = "WORKING";
            document.getElementById('badgeEdt').innerText = "WAITING";
            document.getElementById('badgeUpl').innerText = "WAITING";

            // Kirim data ke bot Telegram
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(url);
            }
        }

        // Audio Lo-Fi Chiptune Generator
        let audioCtx = null, isPlaying = false, synthInterval = null;
        function toggleAudio() {
            const btn = document.getElementById('audioToggle');
            if (!isPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isPlaying = true;
                btn.innerText = "🔇 Matikan";
                btn.style.background = "#10b981";
                synthInterval = setInterval(() => {
                    if (!isPlaying || !audioCtx) return;
                    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    let notes = [261.63, 293.66, 329.63, 392.00, 440.00];
                    osc.frequency.setValueAtTime(notes[Math.floor(Math.random()*notes.length)], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.8);
                }, 600);
            } else {
                if (synthInterval) clearInterval(synthInterval);
                if (audioCtx) audioCtx.close();
                isPlaying = false;
                btn.innerText = "🎵 Musik Chill";
                btn.style.background = "#f43f5e";
            }
        }
    </script>
</body>
</html>
