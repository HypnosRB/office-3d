<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypnos Command Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background: #050811;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 480px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e293b;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .title { 
            font-size: 10px; 
            font-weight: bold; 
            color: #00f0ff; 
            letter-spacing: 0.5px; 
        }
        .audio-btn {
            background: #f43f5e; 
            border: none; 
            color: white; 
            padding: 4px 8px;
            font-size: 9px; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer;
        }
        /* Banner Ilustrasi 3D Isometric Office */
        .office-banner {
            width: 100%;
            max-width: 480px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1e293b;
            margin-bottom: 8px;
            background: #090e1a;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .office-banner img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Panel Kontrol Utama */
        .control-panel {
            width: 100%;
            max-width: 480px;
            background: #0b132b;
            border: 1px solid #00f0ff;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }
        .panel-title { 
            font-size: 9px; 
            color: #fbbf24; 
            font-weight: bold; 
            margin-bottom: 6px; 
        }
        input {
            width: 100%;
            padding: 8px;
            background: #050811;
            border: 1px solid #334155;
            color: white;
            border-radius: 4px;
            font-size: 10px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 6px;
        }
        input:focus {
            border-color: #00f0ff;
        }
        button.action-btn {
            width: 100%;
            padding: 8px;
            background: #00f0ff;
            border: none;
            font-weight: bold;
            color: #020617;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }
        button.action-btn:active { 
            background: #0284c7; 
        }
        #processLog {
            margin-top: 6px;
            font-size: 8px;
            color: #10b981;
            line-height: 1.3;
            background: #050811;
            padding: 6px;
            border-radius: 4px;
            border: 1px dashed #334155;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">⚡ HYPNOS // COMMAND CENTER ACTIVE</div>
        <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🎵 Musik Chill</button>
    </div>

    <!-- Banner Visual 3D Isometric Office -->
    <div class="office-banner">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop" alt="Hypnos 3D Isometric Office">
    </div>

    <!-- Panel Input & Eksekusi Tugas -->
    <div class="control-panel">
        <div class="panel-title">⚡ MASUKKAN LINK YOUTUBE TARGET</div>
        <input type="text" id="ytLink" placeholder="Tempel link YouTube di sini...">
        <button class="action-btn" onclick="submitVideoLink()">Mulai Produksi 5 Klip</button>
        <div id="processLog">Status: Karyawan AI standby di ruangan masing-masing...</div>
    </div>

    <script>
        try { window.Telegram.WebApp.ready(); } catch(e) {}

        function submitVideoLink() {
            const url = document.getElementById('ytLink').value;
            const log = document.getElementById('processLog');
            
            if(!url) {
                log.style.color = "#f43f5e";
                log.innerText = "❌ Masukkan link YouTube terlebih dahulu!";
                return;
            }

            log.style.color = "#00f0ff";
            log.innerText = "⏳ Perintah dikirim! Pantau persentase real-time di chat Telegram...";

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(url);
            }
        }

        // Audio Lo-Fi Chiptune Generator
        let audioCtx = null, isPlaying = false, synthInterval = null;
        function toggleAudio() {
            const btn = document.getElementById('audioToggle');
            if (!isPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isPlaying = true;
                btn.innerText = "🔇 Matikan";
                btn.style.background = "#10b981";
                synthInterval = setInterval(() => {
                    if (!isPlaying || !audioCtx) return;
                    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    let notes = [261.63, 293.66, 329.63, 392.00, 440.00];
                    osc.frequency.setValueAtTime(notes[Math.floor(Math.random()*notes.length)], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.8);
                }, 600);
            } else {
                if (synthInterval) clearInterval(synthInterval);
                if (audioCtx) audioCtx.close();
                isPlaying = false;
                btn.innerText = "🎵 Musik Chill";
                btn.style.background = "#f43f5e";
            }
        }
    </script>
</body>
</html>
